spring:
  application:
    name: scheduler

  # Two connection roles by design (see docs/designs/jdwnrh-scheduler.md,
  # "RLS only binds if the app connects as a non-owner role"):
  #   - flyway (migrations) runs as the schema-OWNING role
  #   - the app's runtime datasource connects as APP_DB_USERNAME, a
  #     separate non-owner role with FORCE ROW LEVEL SECURITY in effect.
  # Both point at the same Neon DIRECT (non-pooled) connection string —
  # never the pgbouncer-pooled one, per the RLS SET LOCAL requirement.
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${APP_DB_USERNAME:scheduler_app}
    password: ${APP_DB_PASSWORD:}

  flyway:
    # Runs as the schema-OWNING role — separate credentials from the app's
    # runtime datasource above, since Flyway needs CREATE ROLE/DDL privileges
    # the low-privilege scheduler_app role deliberately does not have.
    url: ${FLYWAY_DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    user: ${FLYWAY_DB_USERNAME:postgres}
    password: ${FLYWAY_DB_PASSWORD:}
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Explicitly off — see docs/designs/jdwnrh-scheduler.md,
        # "Hibernate's second-level cache must stay disabled": L2 cache has
        # no concept of the per-request RLS session variables, so a cached
        # entity can leak across role/department boundaries.
        cache:
          use_second_level_cache: false
          use_query_cache: false

server:
  port: ${PORT:8080}

app:
  jwt:
    # HMAC-SHA signing key for access tokens. No default on purpose (see
    # /cso security audit, 2026-08-21, Finding 1): a hardcoded fallback here
    # would mean any deployment that forgot to set this env var would sign
    # tokens with a key visible to anyone who's read this file, letting an
    # attacker forge a token for any user/role. Failing to start with no
    # value set is the correct behavior in every environment, local dev
    # included — see run-local.sh.
    secret: ${APP_JWT_SECRET}
  cors:
    # The SPA's origin — frontend and backend are deliberately on different
    # domains (Vercel + Railway/Render). Must be an exact origin, never "*",
    # since credentialed cross-origin requests (the refresh cookie) require
    # the server to echo back the specific calling origin.
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  mail:
    # Default false: LoggingEmailSender is active, no real SMTP account
    # needed to run this locally (see notification/LoggingEmailSender). Set
    # APP_MAIL_ENABLED=true plus spring.mail.host/port/username/password
    # (standard Spring Boot mail properties) to send real email via SmtpEmailSender.
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@jdwnrh.example}
  notifications:
    sender-interval-ms: ${APP_NOTIFICATION_SENDER_INTERVAL_MS:15000}
    reminder-interval-ms: ${APP_REMINDER_INTERVAL_MS:60000}

logging:
  pattern:
    # Structured logging groundwork (see design doc "Observability"): every
    # log line carries the request correlation ID once the MDC filter lands.
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
